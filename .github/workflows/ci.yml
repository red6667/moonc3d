name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned official MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          bash /tmp/install-moonbit.sh '0.10.17+093cb8f9c'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Compiler version
        run: |
          moon version --all
          moonc -v
      - name: Interfaces and formatting
        run: |
          moon info --target all
          moon fmt --check
          git diff --exit-code
      - name: Strict check, tests and build
        run: |
          moon check --deny-warn --target ${{ matrix.target }}
          moon test --deny-warn --target ${{ matrix.target }}
          moon build --deny-warn --target ${{ matrix.target }}
      - name: Runnable downstream workflows
        run: |
          moon run examples/ingest --target ${{ matrix.target }}
          moon run examples/edit --target ${{ matrix.target }}
          moon run examples/export --target ${{ matrix.target }}
      - uses: actions/setup-python@v5
        if: matrix.target == 'js'
        with:
          python-version: '3.11'
      - name: Reference compatibility, CLI, source inventory
        if: matrix.target == 'js'
        run: |
          python -m pip install numpy==1.24.4
          python scripts/differential.py
          python scripts/cli_smoke.py
          python scripts/audit.py
